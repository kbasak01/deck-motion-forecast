[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-motion-forecast"
version = "0.1.0"
description = "Short-horizon 6-DOF deck-motion forecasting from JONSWAP-driven vessel simulation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K. Basak", email = "kbasak@umd.edu" }]
keywords = ["seakeeping", "time-series-forecasting", "jonswap", "gnc", "onnx"]

# Pinned exactly, per the implementation plan's reproducibility requirement. This set
# was resolved and verified on the reference machine (Python 3.12.3, Ubuntu/WSL2,
# RTX A4000, driver 595.61): torch resolved to 2.13.0+cu130 from the default PyPI
# index with CUDA available. If a CPU-only torch wheel is resolved elsewhere, reinstall
# with
#   pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130
#
# The previous version of this comment claimed "onnxruntime-gpu exposes the TensorRT,
# CUDA and CPU execution providers". That is true of `get_available_providers()`, which
# reports what the build was compiled with, and false of session creation, which is the
# only thing that matters -- see P7-D1. Both GPU providers need their shared libraries
# preloaded into the process before `InferenceSession` is constructed:
#   * CUDA EP needs libcublas/libcublasLt/libcudnn, which `import torch` preloads;
#   * TensorRT EP needs libnvinfer.so.10, which only `import tensorrt` preloads.
# `dmf.deploy.providers.preload_gpu_libraries()` does both, so `make bench` works from a
# clean shell with no LD_LIBRARY_PATH. Without the preload ORT falls back to CPU and
# still returns a working session, which is how a "TensorRT" row comes to hold CPU
# timings.
#
# tensorrt-cu13 is pinned to the 10.x series deliberately: onnxruntime-gpu 1.29.0 links
# libnvinfer.so.10, and the current default `tensorrt` release is 11.2.1.2, which ships
# libnvinfer.so.11 and would install cleanly and then never load.
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "torch==2.13.0",
  "onnx==1.22.0",
  "onnxruntime-gpu==1.29.0",
  "tensorrt-cu13==10.16.1.11",
  "matplotlib==3.11.1",
  "rich==15.0.0",
  "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260815",
  "pandas-stubs==3.0.5.260730",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmf = ["py.typed"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH", "N", "D"]
# D203/D213 conflict with the google convention's D211/D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests carry module docstrings but not per-function ones, and fixtures shadow args.
"tests/*" = ["D103", "ARG001"]
"scripts/*" = ["D103"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true

# Packages that ship no type information.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "matplotlib.*", "onnx.*", "onnxruntime.*", "scipy.*", "tensorrt.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: takes more than a few seconds (long simulation records, training runs)",
  "gpu: requires a CUDA device",
]
