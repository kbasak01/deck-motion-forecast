# Phase 6.3 ablation arm a -- observation mode -- `imu` instead of `ideal`.
#
# P1-D6 forbids mixing an `imu` input with an `ideal` target, so this is a separate task
# definition rather than a column of the reference table. Both input and target are `imu`,
# enforced structurally by `dmf.data.dataset.resolve_columns` (P2-D8). Its skill denominator is
# a different number from `ideal`'s, so only skill and nrmse cross the mode boundary and raw
# RMSE never does (P6-D4 item 4). This is the ablation Phase 5 could not do.
#
# The `train` block is byte-identical to `configs/experiment/e02_deep.yaml`: epochs 60,
# batch 1024, lr 2e-3, patience 15, bf16. One budget, one schedule, one stopping rule, so the
# arms differ in the DATA definition and in nothing else. Changing it would make this a
# comparison of two training regimes wearing an ablation's name.
#
# The reference arm is NOT re-run. `results/e02/` already fitted `tcn` (3 seeds) and
# `dlinear_ols` on every regime under this exact train block and `configs/data/default.yaml`;
# its committed rows are read, never regenerated (docs/IMPLEMENTATION_PLAN.md Phase 6
# carry-forward item 7). The one exception is the lookback ablation, where the reference is
# re-SCORED from e02's checkpoints on the window-matched origin set (P6-D4 item 1) -- a
# forward pass, not a refit.
#
# `persistence` must be first: it is the skill-score denominator and
# `dmf.eval.runner.evaluate_models` requires it.
#
# Regime split across two configs, because `ExperimentConfig.regimes` applies to every model in
# the list and the two vehicles have different budgets. This file carries the deep vehicle on
# `id` and `unseen_seastate`; `configs/experiment/e04a_obs_mode_ood.yaml` carries the closed-form vehicles on
# `unseen_heading` and `unseen_vessel`, where they cost minutes and the deep model would cost
# another ~15 h per arm. `dlinear_ols` therefore reports all four regimes and `tcn` reports two,
# and each table says which.
name: e04a_obs_mode
data: ../data/imu.yaml
models:
  - ../model/persistence.yaml
  - ../model/window_mean.yaml
  - ../model/damped_persistence.yaml
  - ../model/ar_p20.yaml
  - ../model/dlinear_ols.yaml
  - ../model/tcn.yaml

train:
  epochs: 60
  batch_size: 1024
  lr: 2.0e-3
  weight_decay: 1.0e-4
  warmup_frac: 0.05
  grad_clip: 1.0
  patience: 15
  amp_dtype: bf16
  num_workers: 16

seeds: [0, 1, 2]
regimes: [id, unseen_seastate]
