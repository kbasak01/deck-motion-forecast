# AR(40) on the three attitude channels only -- an information-set ablation of `ar20`.
#
# Read as a paired difference against configs/model/ar_p20.yaml, never on its own. The two
# rows differ in exactly one thing: which input channels the regression is allowed to read.
# Everything else is matched, including the capacity, which is the whole point of the pair:
#
#   ar20                40 lags? no -- 20 lags x 6 channels = 120 features -> 108 900 params
#   ar_attitude_only    40 lags x 3 channels           = 120 features -> 108 900 params
#
# `order: 40`, not 20, for that reason. At order 20 this model carried 54 900 parameters
# against ar20's 108 900, so the "does the model see the rates?" contrast came bundled with
# a 2x capacity contrast -- exactly the confound this pair replaced `dlinear_mc` to remove
# (docs/protocol.md P3-D13), and not a negligible one: ar10 -> ar20 is the same 2x
# parameter increase at a *fixed* information set and is worth a median +0.0064 skill, the
# same order as the ~0.01 median gap that was being attributed to the rate channels.
#
# `n_input_used` is in **channels**, counted from the front of `input_channels`. Under the
# P2-D4 prefix rule the first three are roll, pitch and heave, so 3 is exactly the attitude
# set and 6 would recover a plain AR(40). The **targets** are untouched: this model still
# forecasts all six channels, including the three rates it cannot see. Fewer input
# channels, more lags, same feature count, same task.
#
# This costs no extra pass over the training split. dmf.models.ar.lag_features is lag-major
# with the channels ordered within each lag block, so the three-channel design matrix is a
# column subset of the six-channel one and the Gram and cross moments cached per regime by
# dmf.train.experiment are sliced (dmf.train.closed_form.subset_columns) rather than
# re-accumulated -- the same trick that already fits p=10, 20 and 40 from one pass at p=40,
# which is the pass ar40 already pays for.
name: ar
label: ar_attitude_only
head: point
quantiles: []
params:
  order: 40
  ridge: 1.0e-6
  n_input_used: 3
